name: Deploy staging
# Every push to main that passes CI goes live on the private staging site. Signs in to Google Cloud
# without a stored key (Workload Identity Federation, limited to this repository's main branch).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  PROJECT: job-apply-agent-staging
  REGION: europe-west1
  DOMAIN: jobs.aicvstudio.app   # AI CV Studio's domain; this app is planned to become its jobs module
  REGISTRY: europe-west1-docker.pkg.dev/job-apply-agent-staging/jaa
  SQL_CONN: job-apply-agent-staging:europe-west1:jaa-db
  RUN_SA: jaa-run@job-apply-agent-staging.iam.gserviceaccount.com
  BUCKET: job-apply-agent-staging-files
  GOOGLE_CLIENT_ID: 644630290784-j7a8potb2ja59dctu8qipef2cn3r95lo.apps.googleusercontent.com
  SIGNUP_ALLOWLIST: nisar.3dcellular@gmail.com
  SANDBOX_RECIPIENT: nisar_87@hotmail.com
  CV_TAILOR_URL: https://tailor-api.aicvstudio.app/v1   # AI CV Studio's tailoring service; the key is the CV_TAILOR_API_KEY secret

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/644630290784/locations/global/workloadIdentityPools/github/providers/job-apply-agent
          service_account: jaa-deploy@job-apply-agent-staging.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          TAG="${GITHUB_SHA::12}"
          docker build -t "$REGISTRY/api:$TAG" backend
          docker build -t "$REGISTRY/web:$TAG" --build-arg NEXT_PUBLIC_API_URL=same-origin \
            --build-arg NEXT_PUBLIC_HIDE_FROM_SEARCH=1 frontend
          docker push "$REGISTRY/api:$TAG"
          docker push "$REGISTRY/web:$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Migrate the database
        run: |
          gcloud run jobs deploy jaa-migrate --image "$REGISTRY/api:$TAG" --region "$REGION" \
            --service-account "$RUN_SA" --set-cloudsql-instances "$SQL_CONN" \
            --set-secrets DATABASE_OWNER_URL=DATABASE_OWNER_URL:latest,DATABASE_URL=DATABASE_URL:latest \
            --command python --args=-m,app.migrate --max-retries 0 --task-timeout 600
          gcloud run jobs execute jaa-migrate --region "$REGION" --wait

      - name: Deploy the API
        run: |
          # Claude is switched on only when the ANTHROPIC_API_KEY secret exists; without it everything runs on Gemini.
          SECRETS="DATABASE_URL=DATABASE_URL:latest,DATABASE_OWNER_URL=DATABASE_OWNER_URL:latest,SECRET_KEY=SECRET_KEY:latest,TOKEN_ENCRYPTION_KEY=TOKEN_ENCRYPTION_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,SCHEDULER_TOKEN=SCHEDULER_TOKEN:latest,CV_TAILOR_API_KEY=CV_TAILOR_API_KEY:latest"
          if gcloud secrets describe ANTHROPIC_API_KEY >/dev/null 2>&1; then SECRETS="$SECRETS,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest"; fi
          gcloud run deploy jaa-api --image "$REGISTRY/api:$TAG" --region "$REGION" \
            --service-account "$RUN_SA" --allow-unauthenticated --execution-environment gen2 \
            --memory 2Gi --cpu 1 --no-cpu-throttling --min-instances 0 --max-instances 2 --timeout 1800 \
            --set-cloudsql-instances "$SQL_CONN" \
            --add-volume name=files,type=cloud-storage,bucket="$BUCKET" --add-volume-mount volume=files,mount-path=/data \
            --set-env-vars "APP_ENV=production,STORAGE_DIR=/data,REDIS_URL=postgres,TASKS_INLINE=true,LLM_PROVIDER=gemini,MAIL_PROVIDER=gmail,HIDE_FROM_SEARCH=true,MANUAL_RUNS_IN_BACKGROUND=true,AGENT_REPLY_ANY_TIME=true,FRONTEND_URL=https://$DOMAIN,GOOGLE_REDIRECT_URI=https://$DOMAIN/api/mail/google/callback,GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID,SIGNUP_ALLOWLIST=$SIGNUP_ALLOWLIST,ADMIN_EMAILS=$SIGNUP_ALLOWLIST,AGENT_MODE=playbook,CV_TAILOR_URL=$CV_TAILOR_URL" \
            --set-secrets "$SECRETS"

      - name: Deploy the website
        run: |
          gcloud run deploy jaa-web --image "$REGISTRY/web:$TAG" --region "$REGION" \
            --allow-unauthenticated --memory 512Mi --min-instances 0 --max-instances 2 --port 8080

      - name: Schedule background work
        run: |
          API_URL=$(gcloud run services describe jaa-api --region "$REGION" --format 'value(status.url)')
          TOKEN=$(gcloud secrets versions access latest --secret SCHEDULER_TOKEN)
          echo "::add-mask::$TOKEN"
          schedule() {  # name, cron, job: recreated each time so the address and token stay current
            gcloud scheduler jobs delete "$1" --location "$REGION" --quiet 2>/dev/null || true
            gcloud scheduler jobs create http "$1" --location "$REGION" --schedule "$2" --time-zone "Asia/Karachi" \
              --uri "$API_URL/api/system/run/$3" --http-method POST --headers "X-Scheduler-Token=$TOKEN" \
              --attempt-deadline 1800s --quiet > /dev/null
          }
          schedule jaa-tick "*/5 * * * *" tick
          schedule jaa-allocate "10 0 * * *" allocate
          schedule jaa-renew-watches "30 3 * * *" renew-watches
          schedule jaa-digest "0 9 * * 1" digest

      - name: Publish the site
        run: npx --yes firebase-tools@14 deploy --only hosting --project "$PROJECT" --non-interactive
        working-directory: deploy/staging

      - name: Check the live site
        run: |
          for url in "https://$PROJECT.web.app/api/health" "https://$DOMAIN/api/health"; do
            echo "$url: $(curl -s --max-time 30 "$url" || echo unreachable)"
          done
          curl -sf --max-time 60 "https://$PROJECT.web.app/api/health" | grep -q '"ok":true'
