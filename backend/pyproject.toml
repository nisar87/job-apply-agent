[project]
name = "job-apply-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2", "psycopg[binary]", "alembic",
  "pydantic-settings", "pydantic[email]", "argon2-cffi", "pyjwt", "cryptography",
  "celery", "redis", "httpx", "google-genai", "python-multipart", "pypdf", "python-docx",
]
[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
