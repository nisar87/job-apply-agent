name: Staging logs
# Read-only: prints recent errors and failed requests of the staging API, so a problem can be diagnosed without
# opening Google Cloud. Run by hand: Actions -> Staging logs -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      extra:
        description: Extra filter, for example  textPayload:"Memory limit"
        default: ""
      minutes:
        description: How many minutes back to read
        default: "90"

jobs:
  logs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/644630290784/locations/global/workloadIdentityPools/github/providers/job-apply-agent
          service_account: jaa-deploy@job-apply-agent-staging.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Errors and failed requests
        run: |
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=jaa-api AND (severity>=WARNING OR httpRequest.status>=500) AND NOT textPayload:\"hset\" AND timestamp>=\"$(date -u -d "${{ inputs.minutes }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)\"" \
            --project job-apply-agent-staging --limit 60 --order desc \
            --format='value(timestamp,severity,httpRequest.status,httpRequest.requestUrl,textPayload,jsonPayload.message)' || true
      - name: The setup requests
        run: |
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=jaa-api AND httpRequest.requestUrl:\"setup/turn\" AND timestamp>=\"$(date -u -d "${{ inputs.minutes }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)\"" \
            --project job-apply-agent-staging --limit 20 --order desc \
            --format='value(timestamp,httpRequest.status,httpRequest.latency)' || true
      - name: Model warnings
        run: |
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=jaa-api AND (textPayload:\"Claude\" OR textPayload:\"trying the other provider\" OR textPayload:\"setup chat\") AND timestamp>=\"$(date -u -d "${{ inputs.minutes }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)\"" \
            --project job-apply-agent-staging --limit 30 --order desc --format='value(timestamp,severity,textPayload)' || true
      - name: Extra filter
        if: inputs.extra != ''
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=jaa-api AND ($EXTRA) AND timestamp>=\"$(date -u -d "${{ inputs.minutes }} minutes ago" +%Y-%m-%dT%H:%M:%SZ)\"" \
            --project job-apply-agent-staging --limit 8 --order desc --format=json | python3 -c "import json,sys;[print(json.dumps({k:e.get(k) for k in ('timestamp','severity','textPayload','httpRequest','jsonPayload')},default=str)[:900]) for e in json.load(sys.stdin)]" || true
      - name: Revisions
        run: gcloud run revisions list --service jaa-api --region europe-west1 --project job-apply-agent-staging --limit 4 || true
      - name: Service settings
        run: |
          gcloud run services describe jaa-api --region europe-west1 --project job-apply-agent-staging \
            --format='value(spec.template.metadata.annotations,spec.template.spec.containers[0].resources.limits,status.latestReadyRevisionName)' || true
